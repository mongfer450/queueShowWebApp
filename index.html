<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Queue Status - Hello.mirilash</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #FDF8F5;
  --surface:   #FFFFFF;
  --rose-deep: #C97B6E;
  --rose-light:#F5DDD8;
  --blush:     #F9EDE9;
  --text:      #2C1810;
  --muted:     #9A7B74;
  --light:     #C4A49E;
  --green:     #6B9E7A;
  --green-bg:  #E8F2EC;
  --line:      #06C755;
  --border:    rgba(201,123,110,0.15);
  --r:         16px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'Sarabun',sans-serif; background:var(--bg); min-height:100vh; display:flex; justify-content:center; }
.app { width:390px; min-height:100vh; display:flex; flex-direction:column; }

/* HEADER */
.header { padding:52px 20px 16px; background:var(--surface); border-bottom:1px solid var(--border); }
.brand { font-family:'Kanit',sans-serif; font-size:22px; font-weight:700; color:var(--text); }
.brand span { color:var(--rose-deep); }
.brand-sub { font-size:12px; color:var(--light); font-weight:300; margin-top:2px; }

/* SCROLL */
.scroll { flex:1; overflow-y:auto; padding:20px 16px 100px; scrollbar-width:none; }
.scroll::-webkit-scrollbar { display:none; }

/* MONTH NAV */
.month-nav-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.mnr-btn { width:32px; height:32px; border-radius:9px; background:var(--blush); border:none; font-size:17px; color:var(--rose-deep); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; user-select:none; }
.mnr-btn:active { transform:scale(0.88); }
.mnr-label { font-family:'Kanit',sans-serif; font-size:15px; font-weight:600; color:var(--text); }

/* STRIP ROW */
.strip-row { display:flex; align-items:center; gap:8px; margin-bottom:20px; }
.cal-strip-wrap { flex:1; overflow-x:auto; scrollbar-width:none; }
.cal-strip-wrap::-webkit-scrollbar { display:none; }
.cal-strip { display:flex; gap:7px; }

.cal-day { flex-shrink:0; width:50px; padding:9px 4px 8px; border-radius:13px; background:var(--surface); border:1.5px solid var(--border); text-align:center; cursor:pointer; transition:all .18s; user-select:none; }
.cal-day:active { transform:scale(0.92); }
.cal-day .day-name { font-size:9px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
.cal-day .day-num  { font-family:'Kanit',sans-serif; font-size:18px; font-weight:600; color:var(--text); line-height:1; margin-bottom:3px; }
.cal-day .day-dot  { width:4px; height:4px; border-radius:50%; background:var(--rose-deep); opacity:0; margin:0 auto; transition:opacity .2s; }
.cal-day.has-slots .day-dot  { opacity:1; }
.cal-day.today     .day-num  { color:var(--rose-deep); }
.cal-day.selected  { background:var(--rose-deep); border-color:var(--rose-deep); }
.cal-day.selected  .day-name { color:rgba(255,255,255,.6); }
.cal-day.selected  .day-num  { color:white; }
.cal-day.selected  .day-dot  { background:rgba(255,255,255,.7); opacity:1; }
.cal-day.today.selected .day-num { color:white; }
.cal-day.past { opacity:.35; pointer-events:none; }

/* CAL ICON BTN */
.cal-icon-btn { flex-shrink:0; width:46px; height:46px; background:var(--rose-deep); border-radius:13px; border:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; cursor:pointer; transition:all .18s; user-select:none; box-shadow:0 4px 12px rgba(201,123,110,.32); }
.cal-icon-btn:active { transform:scale(0.91); box-shadow:none; }
.cal-icon-btn .ci-icon  { font-size:17px; line-height:1; }
.cal-icon-btn .ci-label { font-size:8px; font-weight:700; color:rgba(255,255,255,.85); letter-spacing:.4px; text-transform:uppercase; }

/* DATE HEADING */
.date-heading { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; padding:0 2px; }
.dh-main  { font-family:'Kanit',sans-serif; font-size:19px; font-weight:600; color:var(--text); }
.dh-badge { font-size:12px; font-weight:600; color:var(--green); background:var(--green-bg); padding:4px 12px; border-radius:20px; border:1px solid rgba(107,158,122,.22); }
.dh-badge.none { color:var(--light); background:#F5F5F5; border-color:#EEE; }

/* LOADER */
.loader { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 0; gap:12px; }
.spinner { width:28px; height:28px; border:2.5px solid var(--rose-light); border-top-color:var(--rose-deep); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to{ transform:rotate(360deg); } }
.loader-text { font-size:12px; color:var(--muted); }

/* SLOT GRID */
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px; }

.sc { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--r); padding:18px 8px 14px; text-align:center; cursor:pointer; transition:all .18s; user-select:none; position:relative; overflow:hidden; }
.sc:active { transform:scale(0.95); }
.sc .st { font-family:'Kanit',sans-serif; font-size:21px; font-weight:600; color:var(--text); line-height:1; margin-bottom:6px; }
.sc .sb { font-size:10px; font-weight:600; color:var(--green); letter-spacing:.3px; }
.sc::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; background:var(--green); }
.sc.picked { background:var(--blush); border-color:var(--rose-deep); }
.sc.picked .st { color:var(--rose-deep); }
.sc.picked .sb { color:var(--rose-deep); }
.sc.picked::after { background:var(--rose-deep); }

/* EMPTY / ERROR */
.empty { grid-column:1/-1; text-align:center; padding:44px 20px; background:var(--surface); border-radius:var(--r); border:1.5px dashed var(--border); }
.empty .ei { font-size:38px; margin-bottom:10px; }
.empty .et { font-family:'Kanit',sans-serif; font-size:16px; font-weight:600; color:var(--text); margin-bottom:5px; }
.empty .es { font-size:12px; color:var(--muted); line-height:1.7; }

/* CTA */
.cta-wrap { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:390px; padding:10px 16px 28px; background:linear-gradient(to top, var(--bg) 60%, transparent); z-index:30; }
.btn { display:flex; align-items:center; justify-content:center; gap:7px; width:100%; padding:14px; border-radius:14px; border:none; font-family:'Kanit',sans-serif; font-size:16px; font-weight:700; cursor:pointer; text-decoration:none; transition:all .18s; user-select:none; }
.btn:active { transform:scale(0.97); }
.btn-line { background:var(--line); color:white; box-shadow:0 5px 18px rgba(6,199,85,.35); }
.btn-line svg { width:18px; height:18px; fill:white; flex-shrink:0; }

/* CALENDAR POPUP */
.cal-popup { position:fixed; inset:0; z-index:80; background:rgba(44,24,16,.5); display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(3px); }
.cal-popup.show { display:flex; animation:fadeIn .18s ease; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.cal-sheet { width:390px; background:var(--surface); border-radius:24px 24px 0 0; padding:0 20px 44px; animation:sheetUp .28s cubic-bezier(.34,1.2,.64,1); border-top:1px solid var(--border); }
@keyframes sheetUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.cal-handle { width:36px; height:4px; background:var(--rose-light); border-radius:2px; margin:14px auto 16px; }
.pop-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.pop-nav-btn { width:34px; height:34px; border-radius:9px; background:var(--blush); border:none; font-size:18px; color:var(--rose-deep); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; user-select:none; }
.pop-nav-btn:active { transform:scale(0.88); }
.pop-month { font-family:'Kanit',sans-serif; font-size:15px; font-weight:600; color:var(--text); }
.pop-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.pop-hdr  { text-align:center; font-size:10px; font-weight:700; color:var(--muted); padding:3px 0 7px; }
.pop-cell { aspect-ratio:1; border-radius:9px; display:flex; align-items:center; justify-content:center; font-family:'Kanit',sans-serif; font-size:14px; font-weight:500; color:var(--text); cursor:pointer; transition:all .15s; user-select:none; position:relative; }
.pop-cell:active { transform:scale(0.86); }
.pop-cell.other { color:var(--light); pointer-events:none; }
.pop-cell.past  { color:var(--light); pointer-events:none; opacity:.4; }
.pop-cell.today { color:var(--rose-deep); font-weight:700; }
.pop-cell.has::after { content:''; position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--rose-deep); }
.pop-cell.sel { background:var(--rose-deep); color:white; border-radius:10px; }
.pop-cell.sel::after { background:rgba(255,255,255,.65); }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="brand">Hello.<span>mirilash</span></div>
    <div class="brand-sub">เช็คคิวว่าง</div>
  </div>

  <div class="scroll">

    <!-- MONTH NAV -->
    <div class="month-nav-row">
      <button class="mnr-btn" onclick="prevMonth()">‹</button>
      <div class="mnr-label" id="mnrLabel">—</div>
      <button class="mnr-btn" onclick="nextMonth()">›</button>
    </div>

    <!-- STRIP + CAL ICON -->
    <div class="strip-row">
      <div class="cal-strip-wrap"><div class="cal-strip" id="calStrip"></div></div>
      <button class="cal-icon-btn" onclick="openPop()">
        <span class="ci-icon">📅</span>
        <span class="ci-label">วันอื่น</span>
      </button>
    </div>

    <!-- DATE HEADING -->
    <div class="date-heading">
      <div class="dh-main" id="dhMain">—</div>
      <div class="dh-badge" id="dhBadge">—</div>
    </div>

    <!-- SLOT CONTENT -->
    <div id="slotContent">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <div class="loader-text">กำลังตรวจสอบคิวว่าง...</div>
      </div>
      <div class="grid" id="grid" style="display:none"></div>
    </div>

  </div>

  <!-- CTA -->
  <div class="cta-wrap">
    <a class="btn btn-line" id="ctaBtn" href="https://lin.ee/RRGrXcQ" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M24 10.304c0-5.369-5.383-9.738-12-9.738-6.616 0-12 4.369-12 9.738 0 4.814 4.269 8.846 10.036 9.608.391.084.922.258 1.057.592.121.303.079.778.039 1.085l-.171 1.027c-.052.303-.242 1.186 1.039.647 1.281-.54 6.911-4.069 9.428-6.967 1.739-1.907 2.532-3.791 2.532-6.002z"/></svg>
      <span id="ctaText">ทักจองคิวใน LINE</span>
    </a>
  </div>

</div>

<!-- CALENDAR POPUP -->
<div class="cal-popup" id="calPopup" onclick="closePopOutside(event)">
  <div class="cal-sheet">
    <div class="cal-handle"></div>
    <div class="pop-nav">
      <button class="pop-nav-btn" onclick="popPrev()">‹</button>
      <div class="pop-month" id="popMonth">—</div>
      <button class="pop-nav-btn" onclick="popNext()">›</button>
    </div>
    <div class="pop-grid" id="popGrid"></div>
  </div>
</div>

<script>
// ── CONFIG ──
const API_URL = 'https://script.google.com/macros/s/AKfycbzd2nXgnGC9sbsC8mINCenFnPIYN_wZydSji_xVbmTKy6bJuaIRRyjbsfjBmSd7rBar/exec';
const ALL_TIMES = ['8:00','9:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00','23:00'];

const thDS   = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const thDF   = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const thM    = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thMFull= ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

const today   = new Date(); today.setHours(0,0,0,0);
let selDate   = new Date(today);
let selTime   = null;
let calYear   = today.getFullYear(), calMonth = today.getMonth();
let popYear   = calYear, popMonth = calMonth;
let cachedSlots = {}; // cache per date key

function dateKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function diffDays(d){ return Math.round((d-today)/864e5); }

// ── BUILD STRIP ──
function buildStrip(){
  document.getElementById('mnrLabel').textContent = `${thMFull[calMonth]} ${calYear+543}`;
  const strip = document.getElementById('calStrip');
  strip.innerHTML = '';
  const days = new Date(calYear, calMonth+1, 0).getDate();
  let scrollTo = null;

  for(let d=1; d<=days; d++){
    const cd   = new Date(calYear, calMonth, d);
    const past = cd < today;
    const isTod= cd.getTime()===today.getTime();
    const isSel= cd.getTime()===selDate.getTime();
    const key  = dateKey(cd);
    const hasFr= !past && cachedSlots[key] && cachedSlots[key].length > 0;

    const el = document.createElement('div');
    let cls = 'cal-day';
    if(past) cls+=' past';
    if(isTod) cls+=' today';
    if(isSel) cls+=' selected';
    if(hasFr) cls+=' has-slots';
    el.className = cls;
    el.innerHTML = `<div class="day-name">${thDS[cd.getDay()]}</div><div class="day-num">${d}</div><div class="day-dot"></div>`;
    if(!past) el.addEventListener('click', ()=> selectDate(new Date(calYear, calMonth, d)));
    strip.appendChild(el);
    if(isSel) scrollTo = el;
  }
  if(scrollTo) setTimeout(()=> scrollTo.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}), 50);
}

function prevMonth(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} buildStrip(); }
function nextMonth(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} buildStrip(); }

// ── SELECT DATE + FETCH ──
function selectDate(d){
  selDate = d; selTime = null;
  calYear = d.getFullYear(); calMonth = d.getMonth();
  buildStrip();
  updateHeading();
  fetchQueue();
}

function updateHeading(){
  const diff = diffDays(selDate);
  const lbl  = diff===0?'วันนี้': diff===1?'พรุ่งนี้':`วัน${thDF[selDate.getDay()]} ${selDate.getDate()} ${thM[selDate.getMonth()]}`;
  document.getElementById('dhMain').textContent = lbl;
}

// ── FETCH FROM GOOGLE APPS SCRIPT ──
async function fetchQueue(){
  const key = dateKey(selDate);
  const loader= document.getElementById('loader');
  const grid  = document.getElementById('grid');
  const badge = document.getElementById('dhBadge');

  loader.style.display='flex'; grid.style.display='none';
  badge.textContent='—'; badge.className='dh-badge';

  const now = new Date();
  // filter available times
  function getAvailable(busySlots){
    return ALL_TIMES.filter(time=>{
      const [h] = time.split(':').map(Number);
      const slotStart = new Date(selDate); slotStart.setHours(h,0,0,0);
      const slotEnd   = new Date(slotStart.getTime() + 60*60*1000);
      if(slotStart <= now) return false;
      return !busySlots.some(ev=>{
        const es=new Date(ev.start), ee=new Date(ev.end);
        return es < slotEnd && ee > slotStart;
      });
    });
  }

  try {
    const res  = await fetch(`${API_URL}?date=${key}`);
    const busy = await res.json();
    const free = getAvailable(busy);
    cachedSlots[key] = free;
    renderSlots(free);
  } catch(e){
    renderError();
  }

  loader.style.display='none';
  grid.style.display='grid';
  buildStrip(); // refresh dots
}

// ── RENDER SLOTS ──
function renderSlots(free){
  const grid  = document.getElementById('grid');
  const badge = document.getElementById('dhBadge');
  grid.innerHTML = '';
  selTime = null;
  updateCTA();

  if(!free.length){
    badge.textContent='คิวเต็ม'; badge.className='dh-badge none';
    grid.innerHTML=`<div class="empty"><div class="ei">🌸</div><div class="et">คิวเต็มวันนี้</div><div class="es">ลองเลือกวันอื่น<br>หรือทักแอดมินใน LINE นะคะ</div></div>`;
    return;
  }

  badge.textContent=`${free.length} คิวว่าง`; badge.className='dh-badge';
  free.forEach(t=>{
    const c = document.createElement('div');
    c.className='sc';
    c.innerHTML=`<div class="st">${t}</div><div class="sb">● ว่าง</div>`;
    c.addEventListener('click',()=>{
      document.querySelectorAll('.sc').forEach(s=>s.classList.remove('picked'));
      c.classList.add('picked');
      selTime = t;
      updateCTA();
    });
    grid.appendChild(c);
  });
}

function renderError(){
  document.getElementById('grid').innerHTML=`<div class="empty"><div class="ei">⚠️</div><div class="et">โหลดไม่สำเร็จ</div><div class="es">ลองรีเฟรชใหม่อีกครั้งนะคะ</div></div>`;
  document.getElementById('dhBadge').textContent='—';
}

function updateCTA(){
  const btn  = document.getElementById('ctaBtn');
  const text = document.getElementById('ctaText');
  if(selTime){
    const msg = encodeURIComponent(`สวัสดีค่ะ ขอจองคิว ${selDate.getDate()} ${thM[selDate.getMonth()]} เวลา ${selTime} น. นะคะ 🌸`);
    btn.href = `https://lin.ee/RRGrXcQ?text=${msg}`;
    text.textContent = `จองเวลา ${selTime} น. ใน LINE`;
  } else {
    btn.href = 'https://lin.ee/RRGrXcQ';
    text.textContent = 'ทักจองคิวใน LINE';
  }
}

// ── POPUP CALENDAR ──
function openPop(){ popYear=calYear; popMonth=calMonth; buildPop(); document.getElementById('calPopup').classList.add('show'); }
function closePop(){ document.getElementById('calPopup').classList.remove('show'); }
function closePopOutside(e){ if(e.target===document.getElementById('calPopup')) closePop(); }
function popPrev(){ popMonth--; if(popMonth<0){popMonth=11;popYear--;} buildPop(); }
function popNext(){ popMonth++; if(popMonth>11){popMonth=0;popYear++;} buildPop(); }

function buildPop(){
  document.getElementById('popMonth').textContent=`${thMFull[popMonth]} ${popYear+543}`;
  const grid=document.getElementById('popGrid'); grid.innerHTML='';
  ['อา','จ','อ','พ','พฤ','ศ','ส'].forEach(h=>{ const e=document.createElement('div'); e.className='pop-hdr'; e.textContent=h; grid.appendChild(e); });
  const first=new Date(popYear,popMonth,1).getDay();
  for(let i=0;i<first;i++){ const e=document.createElement('div'); e.className='pop-cell other'; grid.appendChild(e); }
  const days=new Date(popYear,popMonth+1,0).getDate();
  for(let d=1;d<=days;d++){
    const cd=new Date(popYear,popMonth,d);
    const past=cd<today, isTod=cd.getTime()===today.getTime(), isSel=cd.getTime()===selDate.getTime();
    const key=dateKey(cd); const hasFr=!past&&cachedSlots[key]&&cachedSlots[key].length>0;
    const c=document.createElement('div');
    let cls='pop-cell';
    if(past) cls+=' past'; else if(isSel) cls+=' sel'; else if(isTod) cls+=' today';
    if(hasFr) cls+=' has';
    c.className=cls; c.textContent=d;
    if(!past) c.addEventListener('click',()=>{ closePop(); selectDate(new Date(popYear,popMonth,d)); });
    grid.appendChild(c);
  }
}

// ── INIT ──
updateHeading();
buildStrip();
fetchQueue();
</script>
</body>
</html>
